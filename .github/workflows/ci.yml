name: Ultimate Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # BÀI 6: Cài đặt JDK 17 và kích hoạt Cache Maven [cite: 359-362, 596]
    - name: Set up JDK 17 with Maven Cache
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # Bước này chạy Compile, Test, Checkstyle và JaCoCo
    - name: Build and Verify with Maven
      run: mvn clean verify

    # BÀI 3 & 8: Lưu trữ file .jar thực thi [cite: 389-392, 578]
    - name: Upload Executable JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-project-jar-${{ matrix.os }}
        path: target/*.jar
        if-no-files-found: error

    # BÀI 5: Lưu trữ báo cáo JaCoCo (Test Coverage) [cite: 587-593]
    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report-${{ matrix.os }}
        path: target/site/jacoco/